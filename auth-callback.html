<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>驗證處理中...</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>🔐 正在處理驗證中...</h1>
    <p>請稍候，我們正在將您重新導向到應用程式。</p>

    <script>
      // 自動根據網址判斷 appBase
      let appBase;

      if (location.hostname === "amila-lin.github.io") {
        // 線上環境（GitHub Pages）
        appBase = "https://amila-lin.github.io/my-vue-app/#";
      } else {
        // 開發環境
        appBase = "http://localhost:5174/my-vue-app/#";
      }

      // 解析 Supabase 回傳的 hash 參數
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = hashParams.get("access_token");
      const type = hashParams.get("type");
      const error = hashParams.get("error_description");

      // 根據驗證類型轉導到對應 Vue 頁面
      let redirectUrl = `${appBase}/`;

      if (error) {
        redirectUrl = `${appBase}/auth-error?message=${encodeURIComponent(
          error
        )}`;
      } else if (type === "recovery" && accessToken) {
        redirectUrl = `${appBase}/reset-password?access_token=${accessToken}`;
      } else if (type === "signup" && accessToken) {
        redirectUrl = `${appBase}/email-verified?access_token=${accessToken}`;
      } else if (type === "magiclink" && accessToken) {
        redirectUrl = `${appBase}/login?access_token=${accessToken}`;
      }

      // 自動轉導
      window.location.href = redirectUrl;
    </script>
  </body>
</html>
